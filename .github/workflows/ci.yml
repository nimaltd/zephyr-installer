name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip pytest

      - name: Test
        run: python test/run_tests.py

  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check
        run: python -m twine check dist/*

      # What was built, installed the way a user gets it and then started, from
      # outside the checkout so the source tree cannot stand in for it.
      # --no-index because it has to need nothing else.
      - name: Run what was built
        working-directory: ${{ runner.temp }}
        run: |
          wheel="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          python -m venv fresh
          fresh/bin/python -m pip install --no-index "$wheel"
          expected="zephyr-installer $(basename "$wheel" | cut -d- -f2)"
          for got in "$(fresh/bin/zephyr-installer --version)" "$(fresh/bin/python -m zephyr_installer --version)"; do
            echo "$got"
            test "$got" = "$expected"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
